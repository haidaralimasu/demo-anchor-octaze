name: Anchor tests on Octaze

# Runs the escrow program's Anchor tests against a fresh Octaze virtual testnet
# (a mainnet fork) spun up just for this run and torn down afterwards.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Pin the toolchain to what the program was built with (matches Anchor.toml
    # [toolchain] anchor_version and the local dev environment).
    env:
      SOLANA_VERSION: "3.1.13"
      ANCHOR_VERSION: "1.0.0"

    steps:
      - uses: actions/checkout@v4

      # --- Rust ---
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      # --- Solana CLI ---
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # --- Anchor (via AVM) ---
      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --force
          avm install ${ANCHOR_VERSION}
          avm use ${ANCHOR_VERSION}

      # --- Node / deps ---
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: yarn install --frozen-lockfile

      # --- Wallet + program keypair ---
      # A throwaway payer wallet for this CI run; funded on the fork below.
      - name: Create payer wallet
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase -o ~/.config/solana/id.json
      # The program's deploy keypair must match declare_id! (5TDt…). It's
      # gitignored, so provide it as a secret (base58 or JSON array contents).
      - name: Restore program keypair
        run: |
          mkdir -p target/deploy
          echo '${{ secrets.ESCROW_PROGRAM_KEYPAIR }}' > target/deploy/anchor_escrow-keypair.json

      # --- Octaze virtual testnet (fresh fork; auto-torn-down after the job) ---
      - name: Provision Octaze testnet
        id: vnet
        uses: Octaze-Dev/setup-vnet@v1
        with:
          api-key: ${{ secrets.OCTAZE_API_KEY }}
          network: mainnet
          mode: ci

      # --- Wait for the fork's RPC to actually serve (route can lag readiness) ---
      - name: Wait for RPC
        run: |
          for i in $(seq 1 30); do
            ok=$(curl -s -X POST "$OCTAZE_RPC_URL" \
              -H 'content-type: application/json' \
              -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' | grep -c '"result":"ok"' || true)
            if [ "$ok" = "1" ]; then echo "RPC is serving"; exit 0; fi
            echo "waiting for RPC… ($i)"; sleep 3
          done
          echo "RPC never became reachable"; exit 1

      # --- Fund the payer on the fork (retry through any brief blips) ---
      - name: Fund payer on the fork
        run: |
          for i in $(seq 1 5); do
            if solana airdrop 100 --url "$OCTAZE_RPC_URL"; then exit 0; fi
            echo "airdrop retry $i…"; sleep 3
          done
          echo "airdrop failed"; exit 1

      - name: Anchor test
        run: anchor test --skip-local-validator --provider.cluster "$OCTAZE_RPC_URL"
